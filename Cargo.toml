[workspace]
members = ["kernel"]
resolver = "2"

[workspace.package]
edition = "2021"
authors = ["Matzen Kernel Authors <kernel@matzen.dev>"]
description = "Matzen Kernel Framework (MFK) workspace"

[workspace.metadata]
# Central place to keep versions aligned if more crates are added later.
spin-version = "0.9"
x86_64-version = "0.14"
bootloader-version = "0.9"

[profile.dev]
panic = "abort"
codegen-units = 1
lto = false

[profile.release]
panic = "abort"
codegen-units = 1
lto = "fat"
opt-level = "z"
strip = "debuginfo"
