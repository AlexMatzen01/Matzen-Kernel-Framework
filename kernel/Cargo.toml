[package]
name = "mfk-kernel"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mfk-kernel"
path = "src/main.rs"

[dependencies]
bootloader_api = "0.11"
spin = "0.9"
x86_64 = "0.15"
pc-keyboard = "0.7"

[dependencies.lazy_static]
version = "1.5"
features = ["spin_no_std"]
