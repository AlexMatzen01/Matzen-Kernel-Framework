# Force the portable software backend for sha2 v0.11+.
#
# Why: the custom kernel target (targets/x86_64-mfk.json) uses
# `+soft-float` with `-sse*` (no SSE registers in the kernel). sha2's
# default x86 backends (`x86-sha`, `x86-avx2`) use `#[target_feature]`
# SIMD intrinsics that LLVM cannot lower on a soft-float target and the
# backend crashes with:
#   rustc-LLVM ERROR: Do not know how to split the result of this operator!
# Forcing `soft` skips compiling those SIMD modules entirely (pulled in
# via lzma-rust2 -> sha2 for XZ integrity checks). Harmless for host
# builds (runner/tools): same hashes, just no runtime SIMD dispatch.
#
# Companion flags for the TLS stack (`net_tls`, on by default):
# - sha2 v0.10 (transitive via embedded-tls) has no such cfg; it gets the
#   `force-soft` cargo feature through feature unification instead — see
#   the `sha2_010` optional dependency in kernel/Cargo.toml.
# - `aes_force_soft` (aes 0.8) and `polyval_force_soft` (polyval 0.6) force
#   those crates' portable backends, skipping the AES-NI / PCLMULQDQ
#   modules that crash LLVM on this target. ghash delegates to polyval, so
#   it is covered too; ppv-lite86 (via rand_chacha) already selects its
#   generic backend because the target disables sse2.
# - Unknown `--cfg`s are harmless to crates that don't declare them
#   (capped by `--cap-lints allow` on the kernel target).
# If a kernel-target build still fails with the same LLVM error, rebuild
# with `./build.sh --no-tls` and report which crate failed.
#
# See: https://github.com/RustCrypto/hashes/pull/877
#      https://github.com/rust-lang/rust/issues/117938
[build]
rustflags = ['--cfg', 'sha2_backend="soft"', '--cfg', 'aes_force_soft', '--cfg', 'polyval_force_soft']
